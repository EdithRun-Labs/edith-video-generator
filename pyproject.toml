[project]
name = "edith-video-generator"
version = "0.1.0"
description = "Turn a source document into a narrated explainer video, driven by one project spec."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
tts-onnx = ["kokoro-onnx>=0.4"]
tts-mlx = ["mlx-audio>=0.6"]
dev = ["pytest>=8"]

[project.scripts]
edith = "edith.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
