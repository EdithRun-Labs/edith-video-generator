meta:
  title: Why the bakery still sells out
  subtitle: Capacity, throughput and the queue in between
  author: Demo project
  date: 2026-10-29
  language: en
  branding: BAKERY OPERATIONS · DEMO

source:
  file: source.md
  kind: markdown

